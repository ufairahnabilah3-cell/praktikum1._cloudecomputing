<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman Simpel</title>
<style>
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #3b82f6;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --card: #1f2937;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --accent-text: #0b1220;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    background: var(--card);
    padding: 2.5rem 2rem;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
    text-align: center;
    width: min(90%, 380px);
  }
  h1 { margin: 0 0 0.5rem; font-size: 1.8rem; }
  p { margin: 0 0 1.5rem; color: var(--muted); }
  #count { font-size: 3.5rem; font-weight: 700; margin: 0.5rem 0 1.5rem; }
  button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    padding: 0.7rem 1.4rem;
    margin: 0 0.25rem;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { opacity: 0.85; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="greeting">Halo, Dunia!</h1>
    <p>Ini halaman HTML simpel. Coba klik tombolnya.</p>
    <div id="count">0</div>
    <button id="add">Tambah</button>
    <button id="reset">Reset</button>
  </div>

  <script>
    var jam = new Date().getHours();
    var salam = jam < 11 ? "Selamat pagi" : jam < 15 ? "Selamat siang" : jam < 18 ? "Selamat sore" : "Selamat malam";
    document.getElementById("greeting").textContent = salam + "!";

    var n = 0;
    var el = document.getElementById("count");
    document.getElementById("add").onclick = function () { n++; el.textContent = n; };
    document.getElementById("reset").onclick = function () { n = 0; el.textContent = n; };
  </script>
</body>
</html>
